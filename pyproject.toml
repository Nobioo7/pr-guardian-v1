[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-guardian-v1"
version = "0.1.0"
description = "Autonomous Multi-Agent PR Review System"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "pydantic-settings==2.7.1",
    "httpx==0.28.1",
    "PyJWT[crypto]==2.10.1",
    "cryptography==44.0.0",
    "openai==1.59.7",
    "tree-sitter==0.24.0",
    "tree-sitter-language-pack==0.7.3",
    "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "respx==0.22.0",
]

[tool.setuptools]
packages = ["app", "github", "parser", "review", "scanner"]
